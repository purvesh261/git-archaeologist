services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ga
      POSTGRES_PASSWORD: ga
      POSTGRES_DB: ga
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ga']
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction: an evicted job key is a silently lost job.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
